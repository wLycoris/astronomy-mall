  api-key: faxoHiBTRduPxmHntIYuRhpExwhnwk34m5NUOOVj

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh-CN

# 日志配置
logging:
  level:
    com.astronomy.mall: debug
    org.springframework: info
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'