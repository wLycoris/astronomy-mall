server:
  port: 8080
  tomcat:
    max-http-form-post-size: 20MB
    max-swallow-size: -1
  servlet:
    context-path: /

spring:
  application:
    name: astronomy-mall

  # MVC配置 - 解决Knife4j兼容问题
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3308/astronomy_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1

  # 文件上传配置
  # ⚠️ 星图识别使用 base64 JSON 传输（非 multipart），不受此限制
  #    但 max-request-size 影响 JSON body 大小，50MB 足够（base64压缩图约300KB）
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # JSON配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# MyBatis-Plus配置
mybatis-plus:
  # ⚠️ 重要：使用 ** 通配符扫描子目录
  # 原配置 classpath:mapper/*.xml 只扫描 mapper/ 根目录，
  # 无法扫描到 recognition 模块的 mapper/xml/RecognitionMapper.xml
  # 改为 classpath:mapper/**/*.xml 后，所有层级的 XML 都能被加载
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.astronomy.mall.module.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: astronomy-mall-secret-key-2024
  expire: 604800  # 7天(秒)

